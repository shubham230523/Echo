name: Build and Release Windows App

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build MSI
        run: ./gradlew :desktopApp:packageMsi --no-daemon

      - name: Get Version and Package Name
        id: info
        shell: pwsh
        run: |
          # This is a bit hacky but extracts values from build.gradle.kts
          $content = Get-Content desktopApp/build.gradle.kts -Raw
          $packageName = [regex]::Match($content, 'packageName\s*=\s*"([^"]+)"').Groups[1].Value
          $packageVersion = [regex]::Match($content, 'packageVersion\s*=\s*"([^"]+)"').Groups[1].Value
          echo "PACKAGE_NAME=$packageName" >> $env:GITHUB_OUTPUT
          echo "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.PACKAGE_VERSION }}-${{ github.run_number }}
          name: Release v${{ steps.info.outputs.PACKAGE_VERSION }} (Build ${{ github.run_number }})
          draft: false
          prerelease: false
          files: |
            desktopApp/build/compose/binaries/main/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
