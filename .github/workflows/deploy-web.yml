name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Web (Wasm)
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon

      - name: Prepare Pages Artifact
        run: |
          mkdir -p build/pages
          # Copy the production build to the artifact directory
          cp -r webApp/build/dist/wasmJs/productionExecutable/* build/pages/
          
          # Create a 404.html to support SPA routing on GitHub Pages
          cp build/pages/index.html build/pages/404.html
          
          # Optional: List files for debugging
          ls -R build/pages

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
